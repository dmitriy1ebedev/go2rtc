name: Isolated go2rtc MJPEG relay baseline
on:
  pull_request:
    paths:
      - 'internal/camerabench/**'
      - 'internal/mjpeg/**'
      - 'internal/streams/**'
      - 'internal/rtsp/**'
      - 'internal/ffmpeg/**'
      - 'internal/exec/**'
      - 'pkg/core/**'
      - 'pkg/mjpeg/**'
      - '.github/workflows/s2-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check bounded JPEG cache and live frame buffer including race detector
        run: go test -race -count=1 -timeout 90s ./internal/mjpeg ./pkg/mjpeg
      - name: Install synthetic fixture generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build fresh isolated server
        run: |
          mkdir -p relay-report
          go build -trimpath -o "$RUNNER_TEMP/go2rtc-bench" .
          git rev-parse HEAD > relay-report/SOURCE_COMMIT
      - name: Measure actual MJPEG API relay and cleanup
        run: |
          GO2RTC_BENCH_BINARY="$RUNNER_TEMP/go2rtc-bench" GO2RTC_BENCH_REPORT="$PWD/relay-report/relay.json" go test -count=1 -timeout 90s -run '^TestGo2RTCRelayBaseline$' -v ./internal/camerabench
          test -s relay-report/relay.json
      - name: Measure H264 RTSP transcoding with two concurrent clients
        run: |
          GO2RTC_BENCH_BINARY="$RUNNER_TEMP/go2rtc-bench" GO2RTC_RTSP_REPORT="$PWD/relay-report/rtsp.json" go test -count=1 -timeout 90s -run '^TestGo2RTCRTSPBaseline$' -v ./internal/camerabench
          test -s relay-report/rtsp.json
      - name: Compare bounded FFmpeg probing on the same RTSP fixture
        run: |
          GO2RTC_BENCH_BINARY="$RUNNER_TEMP/go2rtc-bench" GO2RTC_RTSP_FAST_PROBE=1 GO2RTC_RTSP_REPORT="$PWD/relay-report/rtsp-fast.json" go test -count=1 -timeout 90s -run '^TestGo2RTCRTSPBaseline$' -v ./internal/camerabench
          test -s relay-report/rtsp-fast.json
      - name: Interrupt active RTSP source and verify replacement frames
        run: |
          GO2RTC_BENCH_BINARY="$RUNNER_TEMP/go2rtc-bench" GO2RTC_RTSP_OUTAGE=1 GO2RTC_RTSP_REPORT="$PWD/relay-report/rtsp-outage.json" go test -count=1 -timeout 120s -run '^TestGo2RTCRTSPBaseline$' -v ./internal/camerabench
          test -s relay-report/rtsp-outage.json
      - uses: actions/upload-artifact@v4
        with:
          name: s2-relay-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: relay-report/
          if-no-files-found: error
          retention-days: 14
