name: Camera-server integration checks
on:
  push:
    branches:
      - feat-camera-server-integration
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

jobs:
  camera-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact source revision
        run: |
          git rev-parse HEAD
          go version
      - name: Camera, ONVIF, embedded web and webOS integration tests
        run: go test -p 1 -count=1 ./internal/cameracaps ./internal/webospip ./pkg/onvif ./www ./webos/tests
      - name: Vet changed packages
        run: go vet ./internal/cameracaps ./internal/webospip ./pkg/onvif ./www ./webos/tests
      - name: Build all production Go packages
        run: go build -p 1 -buildvcs=false ./...
      - name: Verify unchanged webOS JS client
        run: node --check www/webos-pip/camera.js
