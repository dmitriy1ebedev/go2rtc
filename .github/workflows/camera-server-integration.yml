name: Camera-server integration checks
on:
  push:
    branches:
      - feat-camera-server-integration
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

jobs:
  camera-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source revision
        run: |
          git rev-parse HEAD
          go version
      - name: Camera, ONVIF, embedded web and webOS integration tests
        run: go test -p 1 -count=1 -timeout 4m ./internal/cameracaps ./internal/camerametrics ./internal/webospip ./internal/streams ./pkg/core ./pkg/rtsp ./pkg/webrtc ./pkg/onvif ./www ./webos/ipk ./webos/tests
      - name: Vet changed packages
        run: go vet ./internal/cameracaps ./internal/camerametrics ./internal/webospip ./internal/streams ./pkg/core ./pkg/rtsp ./pkg/webrtc ./pkg/onvif ./www ./webos/ipk ./webos/tests
      - name: Build all production Go packages
        run: go build -p 1 -buildvcs=false ./...
      - name: Verify webOS JavaScript syntax
        run: node --check www/webos-pip/camera.js
      - name: Validate deterministic Go-native IPK (no Python)
        run: go run ./webos/cmd/ipk --check
      - name: Stage and checksum Go-native IPK (never deploy)
        run: |
          go run ./webos/cmd/ipk
          sha256sum out/webos/go2rtc-webos-pip-*.ipk
